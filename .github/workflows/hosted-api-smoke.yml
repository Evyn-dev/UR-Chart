name: Hosted UR Chart API smoke check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hosted-api-smoke.yml'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check hosted API and rejected unauthenticated patient access
        shell: bash
        run: |
          set -euo pipefail
          url="https://ur-chart-api.vercel.app"
          for attempt in $(seq 1 8); do
            status=$(curl --max-time 20 --silent --show-error --output /tmp/health.json --write-out "%{http_code}" "$url/api/health" || true)
            echo "Health attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then break; fi
            sleep 6
          done
          python - <<'PY'
          import json
          with open("/tmp/health.json", encoding="utf-8") as stream:
              response=json.load(stream)
          data=response.get("data",{})
          assert data.get("status")=="ok", f"Unexpected health status: {data.get('status')!r}"
          assert data.get("authentication")=="supabase", f"Unexpected authentication configuration: {data.get('authentication')!r}"
          print("Hosted API health confirmed with Supabase Auth")
          PY
          code=$(curl --max-time 20 --silent --show-error --output /tmp/unauth.json --write-out "%{http_code}" "$url/api/patients/me" || true)
          echo "Unauthenticated patient request: HTTP $code"
          test "$code" = "401"
      - name: Verify browser CORS preflight from the deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 20 --silent --show-error --dump-header /tmp/cors.headers --output /tmp/cors.body \
            -X OPTIONS 'https://ur-chart-api.vercel.app/api/patients/me' \
            -H 'Origin: https://ur-chart.vercel.app' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization'
          grep -i -q '^access-control-allow-origin: https://ur-chart.vercel.app' /tmp/cors.headers
          grep -i -q '^access-control-allow-methods:' /tmp/cors.headers
          echo "CORS preflight permitted for the production frontend."

