name: Python Assistant Integration
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/assistant-python.yml'
  push:
    branches:
      - 'feature/python-ai-recovery-assistant'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
