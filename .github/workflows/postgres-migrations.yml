name: PostgreSQL migration compatibility

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-migrations.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/postgres-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: urchart
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: urchart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urchart -d urchart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEMO_AUTH_ENABLED: 'false'
      DATABASE_URL: postgresql+psycopg://urchart:synthetic-ci-only@127.0.0.1:5432/urchart_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install backend and PostgreSQL driver
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "psycopg[binary]>=3.2,<4"
      - name: Apply all existing Alembic migrations
        run: python -m alembic upgrade head
      - name: Verify migration completeness
        run: python -m alembic check
      - name: Validate backend tests against PostgreSQL
        run: python -m pytest -q

      - name: Export migration-tested schema (DDL only, no patient records)
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          if [ -z "$db_container" ]; then
            echo "PostgreSQL service container not found" >&2
            exit 1
          fi
          docker exec -e PGPASSWORD=synthetic-ci-only "$db_container" pg_dump \
            --username=urchart --dbname=urchart_test --schema=public \
            --schema-only --no-owner --no-privileges \
            > "$RUNNER_TEMP/urchart-schema.sql"
          python -c 'import base64,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"urchart-schema.sql"; print("URCHART_SCHEMA_B64_BEGIN"); print(base64.b64encode(p.read_bytes()).decode()); print("URCHART_SCHEMA_B64_END")'
